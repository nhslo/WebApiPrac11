<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Feedback Collector</title><link rel="stylesheet" href="/static/style.css"></head><body><h1>Отзывы</h1><p>Всего отзывов: {{.Total}}</p><form method="post" action="/feedback"><p><input name="author" placeholder="Ваше имя" required></p><p><textarea name="message" placeholder="Ваш отзыв" required></textarea></p><button>Отправить</button></form><h2>Опубликованные отзывы</h2><ul>{{range .Feedbacks}}<li>#{{.ID}} <b>{{.Author}}</b>: {{.Message}}</li>{{else}}<li>Отзывов пока нет</li>{{end}}</ul><a href="/about">О приложении</a></body></html>
